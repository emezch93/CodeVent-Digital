<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Certificate — CodeVent Digital</title>
  <style>
    :root { --primary: #5b4cff; --dark: #0d0f1a; --text: #e8e9f3; --success: #00e5a0; --danger: #ff5b6a; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', Arial, sans-serif; background: var(--dark); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .container { background: #141628; border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; padding: 2.5rem; max-width: 500px; width: 100%; text-align: center; }
    .logo { width: 64px; height: 64px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .status-badge { display: inline-block; padding: 0.5rem 1.5rem; border-radius: 999px; font-weight: 700; font-size: 1.1rem; margin: 1.5rem 0; }
    .status-badge.valid { background: rgba(0, 229, 160, 0.15); color: var(--success); }
    .status-badge.invalid { background: rgba(255, 91, 106, 0.15); color: var(--danger); }
    .details { text-align: left; background: #1c1f38; padding: 1.5rem; border-radius: 0.75rem; margin-top: 1.5rem; font-size: 0.95rem; line-height: 1.6; }
    .details strong { color: #8b8fa8; font-weight: 500; display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .details p { margin: 0 0 1rem 0; color: var(--text); }
    .details p:last-child { margin-bottom: 0; }
    .loader { border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .btn { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: var(--primary); color: white; text-decoration: none; border-radius: 0.5rem; font-weight: 600; border: none; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #4a3ae6; }
    
    /* Manual Form Styles */
    .manual-form { margin-top: 1.5rem; text-align: left; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }
    .manual-form label { display: block; font-size: 0.85rem; color: #8b8fa8; margin-bottom: 0.5rem; margin-top: 1rem; }
    .manual-form input { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1); background: #0d0f1a; color: var(--text); font-size: 1rem; box-sizing: border-box; }
    .manual-form input:focus { outline: none; border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://codeventdigital.site/icons/icon-192x192.png" alt="CodeVent Digital" class="logo" onerror="this.style.display='none'" />
    <h1>Certificate Verification</h1>
    
    <div id="loader" class="loader"></div>
    
    <div id="result" class="hidden">
      <div id="statusBadge" class="status-badge"></div>
      <p id="message" style="color: #8b8fa8; font-size: 0.95rem;"></p>
      
      <div id="details" class="details hidden">
        <p><strong>Recipient</strong> <span id="recipientName"></span></p>
        <p><strong>Course</strong> <span id="courseName"></span></p>
        <p><strong>Issued On</strong> <span id="issuedDate"></span></p>
        <p><strong>Certificate ID</strong> <span id="certId" style="font-family: monospace;"></span></p>
      </div>

      <a id="viewCertBtn" href="#" class="btn hidden">View & Download Certificate</a>
      
      <!-- Manual Verification Fallback Form -->
      <div id="manualForm" class="manual-form hidden">
        <p style="color: #8b8fa8; font-size: 0.9rem; margin-bottom: 1rem;">Your email client may have stripped the link parameters. You can verify manually by copying the details from your email:</p>
        <label for="manualId">Certificate ID</label>
        <input type="text" id="manualId" placeholder="e.g., CV-WEB-2024-ABC123" />
        
        <label for="manualHash">Verification Hash</label>
        <input type="text" id="manualHash" placeholder="Paste the hash from your email" />
        
        <button id="manualVerifyBtn" class="btn" style="width: 100%; margin-top: 1rem;">Verify Manually</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://codevent-support.emezch93.workers.dev";
    
    async function verify(id, hash) {
      document.getElementById("loader").classList.remove("hidden");
      document.getElementById("result").classList.add("hidden");
      document.getElementById("manualForm").classList.add("hidden");

      try {
        const res = await fetch(`${WORKER_URL}/verify-certificate?id=${encodeURIComponent(id)}&hash=${encodeURIComponent(hash)}`);
        const data = await res.json();

        document.getElementById("loader").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");

        if (data.valid && data.certificate) {
          document.getElementById("statusBadge").textContent = "✓ Valid Certificate";
          document.getElementById("statusBadge").classList.add("valid");
          document.getElementById("message").textContent = "This certificate is authentic and was issued by CodeVent Digital.";
          
          document.getElementById("recipientName").textContent = data.certificate.recipientName;
          document.getElementById("courseName").textContent = data.certificate.course;
          document.getElementById("issuedDate").textContent = new Date(data.certificate.issuedAt).toLocaleDateString("en-GB", { year: "numeric", month: "long", day: "numeric" });
          document.getElementById("certId").textContent = data.certificate.certificateId;
          document.getElementById("details").classList.remove("hidden");

          const viewBtn = document.getElementById("viewCertBtn");
          viewBtn.href = `${WORKER_URL}/view-certificate?id=${encodeURIComponent(id)}&hash=${encodeURIComponent(hash)}`;
          viewBtn.classList.remove("hidden");
        } else {
          document.getElementById("statusBadge").textContent = data.status === "revoked" ? "✕ Revoked" : "✕ Invalid";
          document.getElementById("statusBadge").classList.add("invalid");
          document.getElementById("message").textContent = data.message || "This certificate could not be verified. It may have been revoked or the details are incorrect.";
        }
      } catch (err) {
        showError("Unable to connect to the verification server. Please try again later.");
      }
    }

    function showError(msg) {
      document.getElementById("loader").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
      document.getElementById("statusBadge").textContent = "✕ Error";
      document.getElementById("statusBadge").classList.add("invalid");
      document.getElementById("message").textContent = msg;
      
      // Show manual form if parameters are missing from the URL
      if (msg.includes("Missing")) {
        document.getElementById("manualForm").classList.remove("hidden");
      }
    }

    // Initial load: Check URL for parameters
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const hash = params.get("hash");

    if (id && hash) {
      verify(id, hash);
    } else {
      showError("Invalid verification link. Missing certificate ID or hash. (Some email clients strip link parameters. You can verify manually below.)");
    }

    // Manual verification button handler
    document.getElementById("manualVerifyBtn").addEventListener("click", () => {
      const manualId = document.getElementById("manualId").value.trim();
      const manualHash = document.getElementById("manualHash").value.trim();
      if (manualId && manualHash) {
        verify(manualId, manualHash);
      } else {
        alert("Please enter both the Certificate ID and the Verification Hash.");
      }
    });
  </script>
</body>
</html>
